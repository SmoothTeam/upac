[package]
name = "upac-cli"
description = "Package manager for installing any type of package in Linux, as well as registering binary file rollbacks based on composefs, written in Rust"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
license = "GPL-3.0-only"

[[bin]]
name = "up"
path = "src/main.rs"

[dependencies]
upac-abi = { workspace = true }

gettext-rs = { workspace = true }
libloading = { workspace = true }
colored    = { workspace = true }
anyhow     = { workspace = true }
serde      = { workspace = true }
clap       = { workspace = true }
toml       = { workspace = true }
sha2       = { workspace = true }

ctrlc = { version = "3.5.2", features = ["termination"] }
strum = { version = "0.28.0", features = ["derive"] }
nix   = { version = "0.31.3", features = ["user"] }

indicatif = { version = "0.18.4" }
chrono    = { version = "0.4" }
hex       = { version = "0.4" }
