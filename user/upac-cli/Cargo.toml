[package]
name = "upac-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Package manager for installing any type of package in Linux, as well as registering binary file rollbacks based on composefs, written in Rust"

[[bin]]
name = "up"
path = "src/main.rs"

[dependencies]
clap       = { version = "4.6.1", features = ["derive"] }
serde      = { version = "1", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
indicatif  = { version = "0.18.4" }
libloading = { version = "0.9" }
toml       = { version = "1.1.2" }
colored    = { version = "3.1.1" }
anyhow     = { version = "1.0.102" }
chrono     = { version = "0.4" }
sha2       = { version = "0.11" }
hex        = { version = "0.4" }
ctrlc      = { version = "3.5.2", features = ["termination"] }
gettext-rs = { version = "0.7", features = ["gettext-system"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
