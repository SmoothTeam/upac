[workspace]
resolver = "2"
members = ["user/upac-cli", "user/sign-cli", "lib/macro", "lib/abi", "lib/lib" , "lib/pki"]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/SmoothTeam/upac"
authors = ["justpav05 <aksenovpaveldmitrievich@gmail.com>"]

[workspace.dependencies]
gettext-rs = { version = "0.7", features = ["gettext-system"] }
clap       = { version = "4.6.1", features = ["derive"] }
serde      = { version = "1", features = ["derive"] }
syn        = { version = "2", features = ["full"] }

upac-macro  = { path = "lib/macro" }
colored     = "3.1.1"
upac-abi    = { path = "lib/abi" }
upac-pki    = { path = "lib/pki" }
libloading  = "0.9"
proc-macro2 = "1"
toml        = "1.1.2"
anyhow      = "1"
quote       = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
