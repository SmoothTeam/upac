[workspace]
resolver = "3"
members = [
    "cli/up",
    "cli/up-sign",
    "cli/up-setup",
    "lib/up-kit/macro",
    "lib/up-kit/abi",
    "lib/up-kit/pki",
    "lib/up-kit/types",
    "lib/up-kit/locale",
    "lib/up-kit/composefs",
    "lib/up-kit/database",
    "lib/up-kit/deploy",
    "lib/up-kit/hooks",
    "lib/up-kit/image",
    "lib/up-kit/orchestrator",
    "lib/up",
    "lib/up-sp",
    "plugin/boot/boot-kit",
    "plugin/boot/uki",
    "plugin/boot/systemd-boot",
    "plugin/boot/grub",
    "plugin/boot/refind",
    "plugin/decode/decode-kit",
    "plugin/decode/alpm",
    "plugin/decode/deb",
    "plugin/decode/rpm",
    "plugin/decode/xbps"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"

license = "LGPL-3.0-or-later WITH LGPL-3.0-linking-exception"

readme = "README.md"
homepage = "https://github.com/SmoothTeam/upac"
repository = "https://github.com/SmoothTeam/upac"

keywords = ["package-manager", "installer", "cli", "linux"]
categories = ["command-line-utilities", "command-line-interface"]

[workspace.lints.rust]
explicit_outlives_requirements = "warn"
unused_qualifications = "warn"
unexpected_cfgs = "deny"

[workspace.lints.clippy]
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
str_to_string = "warn"

[workspace.dependencies]
upac-lib-macro          = { path = "lib/up-kit/macro" }
upac-lib-types          = { path = "lib/up-kit/types" }
upac-lib-abi            = { path = "lib/up-kit/abi" }
upac-lib-locale         = { path = "lib/up-kit/locale" }
upac-lib-orchestrator   = { path = "lib/up-kit/orchestrator" }
upac-lib-composefs      = { path = "lib/up-kit/composefs" }
upac-lib-database       = { path = "lib/up-kit/database" }
upac-lib-deploy         = { path = "lib/up-kit/deploy" }
upac-lib-decoder-kit    = { path = "plugin/decode/decode-kit" }
upac-lib-hooks          = { path = "lib/up-kit/hooks" }
upac-lib-image          = { path = "lib/up-kit/image" }
upac-lib-booter-kit     = { path = "plugin/boot/boot-kit" }

upac-lib = { path = "lib/up" }
upac-lib-setup    = { path = "lib/up-sp" }
upac-lib-pki      = { path = "lib/up-kit/pki" }

i18n-embed    = { version = "0.16", features = ["fluent-system", "desktop-requester", "filesystem-assets"] }
composefs-oci = { version = "0.10.0", features = ["composefs-boot", "boot", "tar"] }
nix           = { version = "0.31.3", features = ["mount", "sched", "fs", "net"] }
composefs     = { version = "0.10.0", features = ["tempfile"] }
clap          = { version = "4.6.1", features = ["derive"] }
uuid          = { version = "1", features = ["v4"] }
serde         = { version = "1", features = ["derive"] }
syn           = { version = "3", features = ["full", "visit"] }
ctrlc         = { version = "3.5.2", features = ["termination"] }
object        = { version = "0.39.1", default-features = false, features = ["read_core", "elf", "std"] }
rustix        = { version = "1.1.6", features = ["fs"] }

colored        = "3.1.1"
libloading     = "0.9"
proc-macro2    = "1"
toml           = "1.1.2"
sha2           = "0.11"
anyhow         = "1"
quote          = "1"
composefs-boot = "0.10.0"
indicatif      = "0.18.4"
efivar         = "2.0.0"
gptman         = "3.1.1"
udev           = "0.9.3"
tempfile       = "3"
ar             = "0.9.0"
cpio           = "0.4.1"
flate2         = "1.1.9"
linux-raw-sys  = "0.12.1"
quick-xml      = "0.42.0"
tar            = "0.4.46"
xz2            = "0.1.7"
zstd           = "0.14"
i18n-embed-fl  = "0.10"

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.build-override]
opt-level = 3

[profile.release]
codegen-units = 1
opt-level = 3

strip = false
lto = true

debug-assertions = false
debug = "line-tables-only"

[profile.release-x86-64-v1]
inherits = "release"

[profile.release-x86-64-v2]
inherits = "release"

[profile.release-x86-64-v3]
inherits = "release"

[profile.release-x86-64-v4]
inherits = "release"

[profile.release-stripped]
inherits = "release"

strip = true
debug = false
