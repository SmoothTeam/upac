[workspace]
resolver = "3"
members = ["user/upac-cli", "user/sign-cli", "lib/macro", "lib/abi", "lib/lib" , "lib/pki", "lib/types", "booters/uki", "booters/systemd-boot", "booters/grub", "booters/refind"]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "LGPL-3.0-or-later"
rust-version = "1.98"
repository = "https://github.com/SmoothTeam/upac"

[workspace.lints.rust]
explicit_outlives_requirements = "warn"
unused_qualifications = "warn"
unexpected_cfgs = "deny"

[workspace.lints.clippy]
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
str_to_string = "warn"

[workspace.dependencies]
upac-lib = { path = "lib/lib", default-features = false }
upac-macro        = { path = "lib/macro" }
upac-types        = { path = "lib/types" }
upac-abi          = { path = "lib/abi" }
upac-pki          = { path = "lib/pki" }

gettext-rs = { version = "0.7", features = ["gettext-system"] }
clap       = { version = "4.6.1", features = ["derive"] }
serde      = { version = "1", features = ["derive"] }
syn        = { version = "2", features = ["full"] }

colored     = "3.1.1"
libloading  = "0.9"
proc-macro2 = "1"
toml        = "1.1.2"
sha2        = "0.11"
anyhow      = "1"
quote       = "1"
efivar      = "2.0.0"
tempfile    = "3"

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release-x86-64-v1]
inherits = "release"

[profile.release-x86-64-v2]
inherits = "release"

[profile.release-x86-64-v3]
inherits = "release"

[profile.release-x86-64-v4]
inherits = "release"
