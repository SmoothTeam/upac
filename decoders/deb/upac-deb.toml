# Declarative decoder manifest (doc §5.8/§6). Not installed by `cargo build` —
# there is no packaging pipeline (PKGBUILD/spec/etc) in this repo yet; this
# file is the canonical source a future package build copies to
# /etc/upac.d/decoders/upac-deb.toml. `library` matches this crate's
# `[lib] name = "upac_decoder_deb"` (Cargo lib-name-to-filename convention:
# `lib` prefix + name verbatim, underscores kept as-is).
format = "deb"
extensions = ["deb"]
library = "/usr/lib/upac/decoders/libupac_decoder_deb.so"

# Registered in shared-mime-info (freedesktop.org.xml).
mime = "application/vnd.debian.binary-package"
