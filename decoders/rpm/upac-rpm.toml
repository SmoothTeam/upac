# Declarative decoder manifest (doc §5.8/§6). Not installed by any packaging
# pipeline yet — this file is the canonical source a future package build
# copies to /etc/upac.d/decoders/upac-rpm.toml.
format = "rpm"
extensions = ["rpm"]
library = "/usr/lib/upac/decoders/libupac_decoder_rpm.so"

# Registered in shared-mime-info (freedesktop.org.xml).
mime = "application/x-rpm"
