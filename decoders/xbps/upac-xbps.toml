# Declarative decoder manifest (doc §5.8/§6). Not installed by any packaging
# pipeline yet — this file is the canonical source a future package build
# copies to /etc/upac.d/decoders/upac-xbps.toml.
format = "xbps"
extensions = ["xbps"]
library = "/usr/lib/upac/decoders/libupac_decoder_xbps.so"

# No mime type for xbps packages is registered in shared-mime-info (verified
# against freedesktop.org.xml) — this is the same unofficial vendor-prefixed
# convention used elsewhere for formats without a registered type.
mime = "application/x-xbps-package"
