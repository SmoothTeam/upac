# Shared source of truth for external protocol constants used by more than one boot plugin —
# none of this is upac's own ABI, so it doesn't belong in any single plugin crate. Each plugin's
# own build.rs reads this same file and generates its own private layout::boot module; nothing
# here is a Cargo dependency between plugins, just a shared data file.
#
# efi_sysfs_path is the fixed Linux kernel sysfs mount point for UEFI firmware (never
# distro/deployment-configurable, unlike the ESP mount point). sd_boot_loader_guid is systemd's
# vendor GUID for its own boot-loader-interface EFI variables (LoaderInfo, LoaderEntryOneShot,
# LoaderEntryDefault), per systemd's BOOT_LOADER_INTERFACE.md. boot_next_var is a UEFI
# global-namespace variable, no vendor GUID needed.
[boot]
efi_sysfs_path = "/sys/firmware/efi"
sd_boot_loader_guid = "4a67b082-0a4c-41cf-b6c7-440b29bb8c4f"
boot_next_var = "BootNext"
loader_info_var = "LoaderInfo"
loader_entry_one_shot_var = "LoaderEntryOneShot"
loader_entry_default_var = "LoaderEntryDefault"
