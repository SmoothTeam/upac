[package]
name = "upac-xtask"
description = "Developer tooling for upac's own build: repo-internal style lints and other checks, invoked via `cargo xtask`"
version = "0.1.0"

edition = "2024"
publish = false

[lib]
name = "upac_xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }

[workspace]
# Empty on purpose: this marks xtask as its OWN workspace root, so Cargo's
# implicit member auto-discovery doesn't pull it into the root workspace
# (which would otherwise force it onto the same MSRV/edition as every
# other crate here).
