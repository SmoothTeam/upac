# Shared source of truth for the CLI binaries under user/. Each consuming crate's own build.rs
# reads only the section(s) it owns, same convention as decoders/decoder.toml.

# i18n_dir is used by upac-cli/sign-cli, which run on an already-installed system and need to
# know where translations live on disk. A packager can still override it at build time via the
# I18N_DIR env var without touching this file. setup-cli doesn't read this key — it embeds its
# own translations (rust-embed) and never reads an installed system's paths.
i18n_dir = "/usr/share/upac/i18n"

# disk_defaults are up-sp's own compiled-in fallback values for its partition/format flags:
# `partition esp --size`/`--label`, `format esp --label`, and `format create --fs`/
# `--btrfs-node-size`/`--btrfs-sector-size`. Deliberately separate from upac-lib-setup's own
# lib.toml (which has no opinion on any of these) — the CLI's defaults are a CLI-only policy
# decision, not something the library should know or care about.
[disk_defaults]
deploy_fs = "btrfs"
esp_label = "ESP"

btrfs_node_size = 16384
btrfs_sector_size = 4096
esp_size_mib = 256

# initramfs is up-sp's own compiled-in fallback for `bootstrap`'s --initramfs-generator flag.
# Same CLI-only-policy stance as disk_defaults: upac-lib-setup's own
# lib.toml has no opinion on which generator to prefer, only on the filenames it writes once one
# has run.
[initramfs]
generator = "dracut"

# up-sp's own compiled-in progress-bar styling. Deliberately NOT read from
# upac_types::settings::RuntimeSettings (that reads /etc/upac.d/upac.toml at runtime, which
# doesn't exist yet during bootstrap) — tick_chars is plain ASCII on purpose, since up-sp runs on
# a bare Linux console (live media) whose font typically lacks the Unicode Braille glyphs
# indicatif uses by default.
[progress]
spinner_template = "{spinner:.cyan} {msg}"
bar_template = "{spinner:.cyan} [{bar:32.cyan/blue}] {pos}/{len} {msg}"
tick_chars = '-\|/ '
tick_interval_ms = 100
