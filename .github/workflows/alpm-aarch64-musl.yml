name: Make package for Alpm Aarch64 Musl

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest # Используем Arch
    steps:
      - name: Update package via pacman
        run: pacman -Syu --noconfirm

      - name: Install Zig via pacman
        run: pacman -S --noconfirm zig

      - name: Install Make via pacman
        run: pacman -S --noconfirm make

      - name: Build package
        run: make pkg-arch CPU=x86_64_v3 MODE=release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: upac-alpm-aarch64-musl
          path: pkg/*
