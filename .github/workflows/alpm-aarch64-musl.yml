name: Make package for Alpm Aarch64 Musl

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest # Используем Arch
    steps:
      - uses: actions/checkout@v4

      - name: Update package via pacman
        run: pacman -Syu --noconfirm

      - name: Install pkg-config via pacman
        run: pacman -S --noconfirm base-devel

      - name: Install OSTree via pacman
        run: pacman -S --noconfirm ostree

      - name: Install Zig via pacman
        run: pacman -S --noconfirm zig

      - name: Install Make via pacman
        run: pacman -S --noconfirm make

      - name: Build package
        run: make build MODE=release

      - name: Store binaries
        uses: actions/upload-artifact@v4
        with:
          name: upac-binaries
          path: build/
          retention-days: 5
