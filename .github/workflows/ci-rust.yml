name: Rust CI
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "doc/**", "LICENSES/**", "REUSE.toml"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "doc/**", "LICENSES/**", "REUSE.toml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, Test, and Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libblkid-dev libmount-dev clang mold gettext

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --exclude upac-setup --exclude upac-setup-cli -- -D warnings
          cargo clippy -p upac-setup -p upac-setup-cli --all-targets -- -D warnings

      - name: Lint style
        run: cargo xtask lint-style

      - name: Test
        run: |
          cargo test --workspace --lib --tests --exclude upac-setup --exclude upac-setup-cli
          cargo test -p upac-setup -p upac-setup-cli --lib --tests

  link-modes:
    name: Link modes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libblkid-dev libmount-dev clang mold

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build fully dynamic (dlopen upac-lib + booters/decoders)
        run: cargo build -p upac-cli -p upac-lib

      - name: Build fully static (all booters/decoders built in)
        run: |
          cargo build -p upac-cli -p upac-lib --no-default-features \
              --features upac-cli/builtin-all,upac-lib/builtin-all

      - name: Build booters/decoders as standalone dlopen'd plugins
        run: |
          cargo build -p upac-grub -p upac-refind -p upac-systemd-boot -p upac-uki \
              -p alpm -p deb -p rpm -p xbps --features cdylib
