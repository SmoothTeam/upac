name: Rust CI
on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, Test, and Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libblkid-dev libmount-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace --lib --tests

  link-modes:
    name: Link modes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - link: dynamic
            args: ""
          - link: lib-static
            args: "--components uki,systemd-boot"
          - link: full-static
            args: "--components uki,systemd-boot"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libblkid-dev libmount-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build (${{ matrix.link }})
        run: cargo xtask build --arch x86-64-v1 --link ${{ matrix.link }} ${{ matrix.args }}
