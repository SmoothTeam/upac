name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, Test, and Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libblkid-dev libmount-dev clang mold gettext

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Lint style
        run: cargo xtask lint-style

      - name: Test
        run: cargo test --workspace --lib --tests

  link-modes:
    name: Link modes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libblkid-dev libmount-dev clang mold

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Build every dynamic-plugins/static-link/builtin-* combination
        run: |
          cargo hack build -p upac-cli -p upac-lib --feature-powerset \
              --mutually-exclusive-features dynamic-plugins,static-link \
              --at-least-one-of dynamic-plugins,static-link
