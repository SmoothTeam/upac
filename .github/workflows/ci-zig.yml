name: Zig CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Zig Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: ["lib", "alpm", "rpm", "deb", "xbps"]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libarchive-dev

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting (${{ matrix.component }})
        working-directory: ${{ matrix.component }}
        run: zig fmt --check .

      - name: Build (${{ matrix.component }})
        working-directory: ${{ matrix.component }}
        run: zig build

      - name: Run tests (${{ matrix.component }})
        working-directory: ${{ matrix.component }}
        run: zig build test
