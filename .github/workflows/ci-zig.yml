name: Zig CI
on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Zig Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: ["alpm", "rpm", "deb", "xbps"]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libarchive-dev pkg-config

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting (${{ matrix.component }})
        working-directory: decoders/${{ matrix.component }}
        run: zig fmt --check .

      - name: Build (${{ matrix.component }})
        working-directory: decoders/${{ matrix.component }}
        run: zig build
