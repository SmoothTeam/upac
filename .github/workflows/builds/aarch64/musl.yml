name: Build Aarch64 Musl
on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: latest

      - name: Build Binary
        run: make build MODE=release CPU=generic CARGO_TARGET=aarch64-unknown-linux-musl

      - name: Create Packages
        run: make pkg-arch pkg-rpm pkg-deb ARCH=aarch64

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: upac-aarch64-musl
          path: pkg/*
