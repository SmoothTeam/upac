name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build-x86:
    uses: ./.github/workflows/build-x86_64.yml

  build-aarch64:
    uses: ./.github/workflows/build-aarch64.yml

  pkg-arch-x86:
    needs: build-x86
    uses: ./.github/workflows/make-arch-x86_64.yml
    secrets: inherit

  pkg-rpm-x86:
    needs: build-x86
    uses: ./.github/workflows/make-rpm-x86_64.yml
    secrets: inherit

  pkg-deb-x86:
    needs: build-x86
    uses: ./.github/workflows/make-deb-x86_64.yml
    secrets: inherit

  pkg-arch-aarch64:
    needs: build-aarch64
    uses: ./.github/workflows/make-arch-aarch64.yml
    secrets: inherit

  pkg-rpm-aarch64:
    needs: build-aarch64
    uses: ./.github/workflows/make-rpm-aarch64.yml
    secrets: inherit

  pkg-deb-aarch64:
    needs: build-aarch64
    uses: ./.github/workflows/make-deb-aarch64.yml
    secrets: inherit

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - pkg-arch-x86
      - pkg-rpm-x86
      - pkg-deb-x86
      - pkg-arch-aarch64
      - pkg-rpm-aarch64
      - pkg-deb-aarch64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: "*-package-*"
          path: packages/
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create source archive
        run: |
          git archive --format=tar.gz \
            --prefix=upac-${{ github.ref_name }}/ \
            HEAD \
            -o packages/upac-${{ github.ref_name }}-source.tar.gz

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "upac ${{ github.ref_name }}"
          body_path: CHANGELOG.MD
          files: packages/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
