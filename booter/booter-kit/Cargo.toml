[package]
name = "upac-lib-booter-kit"
description = "upac's boot plugin kit: the contract a boot plugin implements, and one boot plugin on the host side"
version.workspace = true

edition.workspace = true
rust-version.workspace = true

license.workspace = true

readme.workspace = true
homepage.workspace = true
repository.workspace = true

keywords.workspace = true
categories.workspace = true

include = ["/src"]

[lints]
workspace = true

[lib]
name = "upac_booter_kit"

[dependencies]
upac-lib-abi   = { workspace = true }
upac-lib-types = { workspace = true, optional = true }

libloading = { workspace = true, optional = true }
serde      = { workspace = true, optional = true }
toml       = { workspace = true, optional = true }

[features]
plugin = ["dep:upac-lib-types"]
host = [
    "dep:upac-lib-types",
    "dep:serde",
    "dep:toml",
]
dynamic-plugins = ["host", "dep:libloading"]
