name = "uki"
library = "/usr/lib/upac/booters/libupac_boot_uki.so"

[efivarfs]
path = "/sys/firmware/efi/efivars"

[variables]
boot_next = "BootNext"
boot_order = "BootOrder"

[esp]
linux_directory = "\\EFI\\Linux\\"
linux_path = "EFI/Linux"
image_extension = "efi"

[slots]
to = "upac-to"
from = "upac-from"

[udev]
subsystem = "block"
disk_devtype = "disk"
partition_uuid = "PARTUUID"
partition_number = "partition"
partition_start = "start"
partition_size = "size"
logical_block_size = "queue/logical_block_size"

[device_path]
sector_size = 512
partition_format = 2
