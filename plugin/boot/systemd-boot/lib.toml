name = "systemd-boot"
library = "/usr/lib/upac/booters/libupac_boot_systemd_boot.so"

[efivarfs]
path = "/sys/firmware/efi/efivars"

[loader]
vendor_guid = "4a67b082-0a4c-41cf-b6c7-440b29bb8c4f"
entry_one_shot = "LoaderEntryOneShot"
entry_default = "LoaderEntryDefault"

[install]
tool = "bootctl"
command = "install"
esp_path_flag = "--esp-path="
