[reboot]
tools = ["grub-reboot", "grub2-reboot"]

[set_default]
tools = ["grub-set-default", "grub2-set-default"]

[install]
tools = ["grub-install", "grub2-install"]

target_flag = "--target="
target = "x86_64-efi"

efi_directory_flag = "--efi-directory="
boot_directory_flag = "--boot-directory="

bootloader_id_flag = "--bootloader-id="
bootloader_id = "upac"

[config]
directory = "grub"
file = "grub.cfg"
contents = '''
insmod blscfg
load_env
if [ "${next_entry}" ] ; then
    set default="${next_entry}"
    set next_entry=
    save_env next_entry
else
    set default="${saved_entry}"
fi
blscfg
'''
