[efivarfs]
path = "/sys/firmware/efi/efivars"

[variables]
boot_next = "BootNext"
boot_order = "BootOrder"

[udev]
subsystem = "block"
disk_devtype = "disk"
partition_uuid = "PARTUUID"
partition_number = "partition"
partition_start = "start"
partition_size = "size"
logical_block_size = "queue/logical_block_size"

[device_path]
separator = "\\"

sector_size = 512
partition_format = 2
