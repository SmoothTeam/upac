format = "rpm"
library = "/usr/lib/upac/decoders/libupac_decoder_rpm.so"
mime = "application/x-rpm"

extensions = ["rpm"]

[lead]
size = 96

[scripts]
prein = "pre"
postin = "post"
preun = "preun"
postun = "postun"

[tags]
name = 1000
version = 1001
release = 1002
summary = 1004
size = 1009
license = 1014
packager = 1015
url = 1020
arch = 1022
prein = 1023
postin = 1024
preun = 1025
postun = 1026
file_user_name = 1039
file_group_name = 1040
require_flags = 1048
require_name = 1049
require_version = 1050
dir_indexes = 1116
base_names = 1117
dir_names = 1118
payload_format = 1124
payload_compressor = 1125
file_caps = 5010

[payload]
format = "cpio"
default_compressor = "gzip"
gzip = "gzip"
xz = "xz"
zstd = "zstd"
none = "none"

[capabilities]
prefix = "cap_"
all = "all"
names = [
    "chown",
    "dac_override",
    "dac_read_search",
    "fowner",
    "fsetid",
    "kill",
    "setgid",
    "setuid",
    "setpcap",
    "linux_immutable",
    "net_bind_service",
    "net_broadcast",
    "net_admin",
    "net_raw",
    "ipc_lock",
    "ipc_owner",
    "sys_module",
    "sys_rawio",
    "sys_chroot",
    "sys_ptrace",
    "sys_pacct",
    "sys_admin",
    "sys_boot",
    "sys_nice",
    "sys_resource",
    "sys_time",
    "sys_tty_config",
    "mknod",
    "lease",
    "audit_write",
    "audit_control",
    "setfcap",
    "mac_override",
    "mac_admin",
    "syslog",
    "wake_alarm",
    "block_suspend",
    "audit_read",
    "perfmon",
    "bpf",
    "checkpoint_restore",
]
