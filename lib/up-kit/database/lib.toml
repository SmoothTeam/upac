[node]
separator = "-"
file_prefix = "file"
symlink_prefix = "symlink"
dir_prefix = "dir"

permission_mask = 0o7777

[package]
separator = ":"
lossy_replacement = "_"

[store]
root_dir = "pkg"
link_root = "/"
forbidden_characters = "/\u0000"

file_mode = 0o644
dir_mode = 0o755
link_mode = 0o777

[meta]
file_name = "meta"

[trigger]
file_prefix = "trigger:"
xattr_prefix = "user.upac.trigger."

[transaction]
dir = "upac-tx"
separator = ":"
subject_xattr = "user.upac.tx.subject"
message_xattr = "user.upac.tx.message"
