[entry]
separator = "-"
file_prefix = "file"
symlink_prefix = "symlink"
dir_prefix = "dir"

permission_mask = 0o7777

[package]
separator = ":"
lossy_replacement = "_"

[store]
root_dir = "pkg"
link_root = "/"

file_mode = 0o644
dir_mode = 0o755
link_mode = 0o777

[trigger]
file_name = "triggers"
xattr = "user.upac.triggers"
format_xattr = "user.upac.format"
separator = " "
line_separator = "\n"

[transaction]
dir = "upac-tx"
separator = ":"
subject_xattr = "user.upac.tx.subject"
message_xattr = "user.upac.tx.message"
