# sysroot_root_mode is the permission set of the physical partition's top directory: only root
# may look into the deploys and the repository it holds.
[deployment]
root_dir = "/"
deploys_dir = "deploy"
repo_dir = "composefs"
sysroot_dir = "state"
current_link = "current"
current_link_staging = "current.new"
config_dir = "config"
upper_dir = "upper"
work_dir = "work"
history_dir = "history"
pinned_file = "pinned"

sysroot_root_mode = 0o700

[fs]
new_file_mode = 0o644

[snapshot]
digest_xattr = "user.upac.snapshot.digest"
message_xattr = "user.upac.snapshot.message"
