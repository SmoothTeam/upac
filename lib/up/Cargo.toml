[package]
name = "upac-lib"
description = "Core library implementing upac's package management logic (composefs-based atomic deploys) and exposing it via a C ABI"
version.workspace = true

edition.workspace = true
rust-version.workspace = true

license.workspace = true

readme.workspace = true
homepage.workspace = true
repository.workspace = true

keywords.workspace = true
categories.workspace = true

include = ["/src", "lib.toml", "build.rs"]

[lints]
workspace = true

[lib]
name = "upac"
crate-type = ["cdylib", "rlib"]

[dependencies]
upac-lib-macro          = { workspace = true }
upac-lib-types          = { workspace = true }
upac-lib-abi            = { workspace = true }
upac-lib-orchestrator   = { workspace = true }
upac-lib-composefs      = { workspace = true }
upac-lib-database       = { workspace = true }
upac-lib-deploy         = { workspace = true }
upac-lib-hooks          = { workspace = true }
upac-lib-decoder-kit    = { workspace = true }
upac-lib-booter-kit     = { workspace = true }

composefs = { workspace = true }
uuid      = { workspace = true }
quick-xml = { workspace = true }

regex = "1"

[build-dependencies]
toml = { workspace = true }
