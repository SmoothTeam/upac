# mount.default_mount_point is where the bootstrap commands mount the target deployment partition
# (and, for `bootstrap deploy`, the ESP under it) when the request's own mount_point is left empty.
[mount]
default_mount_point = "/mnt/upac-setup"

# mkfs.ext4_bin/xfs_bin are the mkfs binaries shelled out to for ext4/xfs formatting; ext4 always
# gets fs-verity on since composefs needs it (btrfs is done natively via btrfs-mkfs, ESP natively via fatfs).
# mkfs.wipefs_bin clears a device's existing signatures (crate::wipe), only when the request
# explicitly opts into it (`force_wipe` on both `partition_table` and `format_partition`) — never
# run silently. Without force_wipe it still runs, in list-only mode (no `-a`), and the command
# refuses to touch a device that reports any signature at all (`DeviceNotEmpty`).
[mkfs]
ext4_bin = "mkfs.ext4"
xfs_bin = "mkfs.xfs"
wipefs_bin = "wipefs"

# partition.settle_attempts/settle_interval_ms bound how long `partition_add`'s SettleStage waits
# for the kernel (via udev) to create the new partition device node after BLKRRPART, before giving
# up — the ioctl itself is synchronous, but the /dev/vdaN node it triggers is created by udev
# asynchronously afterward.
#
# partition.fallback_sector_size is the logical sector size (bytes) `partition_table` builds the
# new GPT with when the BLKSSZGET ioctl can't report the device's real one (e.g. a plain disk
# image file instead of a block device). `partition_add` never uses it — it reads the sector size
# back from the existing GPT itself.
[partition]
fallback_sector_size = 512
settle_attempts = 50
settle_interval_ms = 100

# initramfs.dracut_bin/mkinitcpio_bin are the host binaries `bootstrap kernel` runs against the
# exported target tree to build its initramfs (or UKI), picked by the request's
# initramfs_generator. initramfs.depmod_bin builds the kernel's module index (modules.dep,
# modules.alias, …) first: packages don't ship it (pacman's depmod hook normally generates it), yet
# both the generator and the booted system's udev need it, so `bootstrap kernel` also imports it into
# the prefix image. A missing binary is reported as `ToolNotInstalled`, not as a generic I/O error.
# initramfs.generator_tmp_dir is created inside the exported tree before the generator runs: dracut
# run with --sysroot keeps its temporary files under <sysroot>/var/tmp and refuses to start without it.
[initramfs]
depmod_bin = "depmod"
dracut_bin = "dracut"
generator_tmp_dir = "var/tmp"
mkinitcpio_bin = "mkinitcpio"

# bootstrap.scratch_dir is the work directory bootstrap keeps on the mounted deployment partition
# for everything too big for the installer's RAM-backed /tmp: extracted --source archives,
# unpacked packages and the /usr tree exported for the initramfs generator. `MountedTarget` creates
# it on mount and removes it before unmounting, so nothing is left behind on the installed system.
#
# system_dir is a source-relative directory, sibling to the package archives `bootstrap import`'s
# PrepareStage collects (skipped by it automatically — it only looks at files, never directories) —
# a literal, 1:1 mirror of the prefix image, imported wholesale by its SystemStage as files no
# package owns. This is how a built `up`/`upac-lib`/booters (or anything else that must exist
# outside the normal per-package pipeline) gets onto a bootstrapped disk — bootstrap never resolves or
# installs itself automatically, whoever assembles `--source` has to put it there, same assumption
# already made for the systemd-boot/rEFInd binaries.
#
# config_dir is system_dir's `/etc` counterpart: an optional source-relative directory mirroring the
# target's `/etc`, laid over the first config after the packages' own defaults, so its files win on
# the same path. It is how config that no package ships reaches a freshly bootstrapped system (e.g.
# `/etc/upac.d/{decoders,boot-plugins}/*.toml`, which the new system's own `up` needs). Unlike the
# packages' defaults, it is imported even with `empty_config`.
#
# composefs_setup_root_unit_path (relative to `system_dir`) is where SystemStage requires to find a
# `composefs-setup-root.service` unit, and at system_dir's top the empty sysroot directory setup-root
# mounts the physical root onto — `NotFound` if either is missing, since a bootstrapped disk cannot boot at
# all without them. SystemStage deliberately does NOT create the unit's `*.target.wants/`
# enablement symlink itself — `initrd-root-fs.target` only exists inside the initrd's own systemd
# instance, so wanting it from the real root's unit tree is a no-op after switch-root. The dracut
# module under `hook/dracut/37composefs/` creates that enablement at initrd-build time instead
# (`$SYSTEMCTL --root "${initdir}" add-wants`), which is the only place it can actually take effect.
#
# initramfs_filename is fixed by composefs-boot itself, not our choice — `UsrLibModulesVmlinuz::
# load_all` only recognizes a vmlinuz's companion initramfs under this exact name. `bootstrap kernel`
# always builds a plain initramfs: a UKI is assembled from it only when the boot entry is written.
#
# modules_dir is where, inside the prefix image, a kernel keeps its modules and where
# `bootstrap kernel` finds its version and puts the initramfs or UKI. module_index_prefix marks the
# files depmod writes next to the modules (modules.dep, modules.alias, …): packages don't ship
# them, yet both the generator and the booted system's udev need them, so they go into the image too.
#
# subject is the subject of the first transaction and the first config of a bootstrapped system.
[bootstrap]
scratch_dir = ".upac-setup"
subject = "bootstrap"

composefs_setup_root_unit_path = "lib/systemd/system/composefs-setup-root.service"
config_dir = "config"
system_dir = "system"

initramfs_filename = "initramfs.img"
module_index_prefix = "modules."
modules_dir = "lib/modules"
