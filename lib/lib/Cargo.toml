[package]
name = "upac-lib"
description = "Core library implementing upac's package management logic (composefs-based atomic deploys) and exposing it via a C ABI"
version.workspace = true

edition.workspace = true
rust-version.workspace = true

license.workspace = true

readme.workspace = true
homepage.workspace = true
repository.workspace = true

keywords.workspace = true
categories.workspace = true

include = ["/src", "lib.toml", "build.rs"]

[lints]
workspace = true

[lib]
name = "upac"
crate-type = ["cdylib", "rlib"]

[dependencies]
upac-macro        = { workspace = true }
upac-types        = { workspace = true }
upac-abi          = { workspace = true }
upac-pki          = { workspace = true }
upac-uki          = { workspace = true, optional = true }
upac-systemd-boot = { workspace = true, optional = true }
upac-grub         = { workspace = true, optional = true }
upac-refind       = { workspace = true, optional = true }
upac-decoders-alpm = { workspace = true, optional = true }
upac-decoders-deb  = { workspace = true, optional = true }

composefs     = { workspace = true }
composefs-oci = { workspace = true }
composefs-boot = { workspace = true }
nix           = { workspace = true }

libloading = { workspace = true, optional = true }
anyhow     = { workspace = true }
serde      = { workspace = true }
toml       = { workspace = true }
sha2       = { workspace = true }
tempfile   = { workspace = true }
uuid       = { workspace = true }

redb          = { version = "4.1.0", features = ["uuid"] }
tokio         = { version = "1", features = ["rt"] }

linux-kernel-cmdline  = "0.1.1"
serde_json            = "1.0.151"
twox-hash             = "2.1.3"
rsblkid               = "0.4"
rsmount               = "0.2"
regex                 = "1"
quick-xml             = "0.42.0"
mime                  = "0.3.17"
hex                   = "0.4"
xattr                 = "1.6"

[build-dependencies]
toml = { workspace = true }

[features]
default = ["dynamic-plugins"]

dynamic-plugins = ["dep:libloading"]

builtin-booters  = []
builtin-decoders = []

builtin-uki          = ["dep:upac-uki", "builtin-booters"]
builtin-systemd-boot = ["dep:upac-systemd-boot", "builtin-booters"]
builtin-grub         = ["dep:upac-grub", "builtin-booters"]
builtin-refind       = ["dep:upac-refind", "builtin-booters"]

builtin-alpm = ["dep:upac-decoders-alpm", "builtin-decoders"]
builtin-deb  = ["dep:upac-decoders-deb", "builtin-decoders"]

builtin-all = [
    "builtin-uki", "builtin-systemd-boot", "builtin-grub", "builtin-refind",
]
