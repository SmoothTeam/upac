# Names of the redb tables inside the package database embedded in the image.
# Changing a name means already-built images stop finding their tables when
# reading their DB (tables are looked up by name) — data isn't lost, but
# becomes unreachable through the API.
#
# database_path is where the redb file itself lives inside the mounted /usr
# tree (relative to that tree's root, e.g. read via FileHandle::read_file
# after Deploy::open_tree(prefix_digest), see doc §7). Changing it means
# already-built images stop finding their own embedded DB on read.
[database]
packages_table_name = "packages"
packages_by_name_table_name = "packages_by_name"
files_table_name = "files"
files_by_path_table_name = "files_by_path"
packages_meta_type_name = "upac::PackageMeta"
files_entry_type_name = "upac::FileEntry"
database_path = "share/upac/packages.redb"

# Names of the well-known directories on the deployment partition (deploy
# records + composefs repo, see doc §3). Changing a name means existing
# installs stop finding their deploys/repo on upgrade.
#
# prefix_digest_cmdline_param names the kernel cmdline parameter written at
# boot entry creation (§5.2, "composefs.digest=D'") and read back at runtime
# to resolve the currently booted deploy's prefix_digest — one name shared by
# both sides.
[deployment]
root_dir = "/"
deploys_dir = "state/deploy"
repo_dir = "composefs"
sysroot_dir = "sysroot"
record_filename = "meta.json"
prefix_digest_cmdline_param = "composefs.digest"

# Name of the abstract Unix socket address upac uses to hold its exclusive
# process lock (bind() on this address — a second concurrent upac gets
# EADDRINUSE). Changing the name doesn't break on-disk data compatibility,
# but a concurrently running old and new upac version stop seeing each other
# as competitors.
[runtime]
lock_address = "upac.lock"

# Directory holding hook files (§5.8) and the path to the trusted root
# certificate used to verify them. root_cert_path is a configurable file: a
# distro/OEM plugs in its own root without rebuilding upac; hooks signed
# under the old root stop verifying after the switch. hook_extension and
# signature_extension (without the leading dot) name the hook file itself
# and its detached signature sidecar (name.hook + name.hook.sig).
[hooks]
hooks_dir = "/etc/upac.d/hooks"
root_cert_path = "/etc/upac.d/root.crt"
hook_extension = "hook"
signature_extension = "sig"

# Directory holding declarative decoder manifests (§6): small TOML files, one
# per decoder, each naming the package format it handles (format = "...",
# singular — one decoder never covers more than one format), the file
# extensions/archive variants of that format it can actually open (extensions
# = [...] — e.g. alpm packages ship as pkg.tar/pkg.tar.gz/pkg.tar.xz/etc, all
# one format but several file variants), the library to dlopen for it
# (library = "..."), and the mime type that format registers as (mime =
# "...", also singular — this is what binds the decoder backend to desktop
# integration, see `up mime sync` / [mime] below). This is not the directory
# the decoder .so files themselves live in — lib never scans or probes a .so
# directly, it resolves the library name/path straight from the matching
# manifest's `library` field on first use. manifest_extension (without the
# leading dot) names the manifest file itself.
[decoders]
decoders_dir = "/etc/upac.d/decoders"
manifest_extension = "toml"

# Directory holding declarative boot-plugin manifests, same shape as
# [decoders] above: small TOML files, one per plugin, naming the plugin
# (name = "...") and the library to dlopen for it (library = "..."). A boot
# plugin implements one-shot reboot selection (§5.2) for one specific
# bootloader/firmware mechanism (UKI-direct, systemd-boot, grub, ...) —
# resolved either by an explicit --boot <name> override, or, with none given,
# by probing every installed plugin and using whichever one claims to manage
# the current system's boot (a hard error if zero or more than one do).
# manifest_extension (without the leading dot) names the manifest file
# itself.
[boot_plugins]
boot_plugins_dir = "/etc/upac.d/boot-plugins"
manifest_extension = "toml"

# Paths `up mime sync` reads from/writes to when regenerating desktop
# integration from the currently installed decoder manifests' mime fields
# (see [decoders] above). mime_db_dir/applications_dir are the parent
# directories update-mime-database/update-desktop-database themselves take as
# their argument (they rebuild the whole cache under that directory, not just
# one file); mime_xml_path/desktop_file_path are the specific files this
# command writes. The *_bin names are looked up on $PATH; missing binaries are
# a soft failure (see doc §7 mime module notes), not a hard error.
# shared_mime_info_xmlns is the fixed XML namespace every shared-mime-info
# package XML file must declare on its root <mime-info> element — not our
# ABI, an external spec constant.
[mime]
mime_xml_path = "/usr/share/mime/packages/upac-mime.xml"
mime_db_dir = "/usr/share/mime"
desktop_file_path = "/usr/share/applications/io.github.smoothteam.upac.desktop"
applications_dir = "/usr/share/applications"
update_mime_database_bin = "update-mime-database"
update_desktop_database_bin = "update-desktop-database"
shared_mime_info_xmlns = "http://www.freedesktop.org/standards/shared-mime-info"

# Names of EFI variables used for one-shot/persistent boot selection (§5.2), plus the vendor GUID
# for the systemd-boot loader interface variables (LoaderEntryOneShot/LoaderEntryDefault, per
# systemd's own BOOT_LOADER_INTERFACE.md). boot_next_var is a UEFI global-namespace variable, no
# vendor GUID needed. None of this is our ABI — external protocol constants, kept here rather than
# hardcoded so a spec revision doesn't need a rebuild-triggering source edit.
[boot]
sd_boot_loader_guid = "4a67b082-0a4c-41cf-b6c7-440b29bb8c4f"
boot_next_var = "BootNext"
loader_entry_one_shot_var = "LoaderEntryOneShot"
loader_entry_default_var = "LoaderEntryDefault"
