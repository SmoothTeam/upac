# Scratch filenames each mutating command's TransactionStage writes the rebuilt package database
# to (inside the shared system tmp_path) before re-inserting it into the new /usr tree — purely
# transient, read back once via File::open right after the write and never inspected afterward.
# Kept distinct per command rather than one shared name so a stale leftover file in tmp_path
# (e.g. after a crash) is still identifiable by which command wrote it.
[database]
installer_scratch_filename = "installer-packages.redb"
update_scratch_filename = "update-packages.redb"
uninstall_scratch_filename = "uninstall-packages.redb"
files_scratch_filename = "files-packages.redb"

# Paths `up mime sync` reads from/writes to when regenerating desktop
# integration from the currently installed decoder manifests' mime fields
# (see upac-lib-decoder-loader's [decoders]). mime_db_dir/applications_dir are the parent
# directories update-mime-database/update-desktop-database themselves take as
# their argument (they rebuild the whole cache under that directory, not just
# one file); mime_xml_path/desktop_file_path are the specific files this
# command writes. The *_bin names are looked up on $PATH; missing binaries are
# a soft failure (see doc §7 mime module notes), not a hard error.
# shared_mime_info_xmlns is the fixed XML namespace every shared-mime-info
# package XML file must declare on its root <mime-info> element — not our
# ABI, an external spec constant.
[mime]
mime_xml_path = "/usr/share/mime/packages/upac-mime.xml"
mime_db_dir = "/usr/share/mime"
desktop_file_path = "/usr/share/applications/io.github.smoothteam.upac.desktop"
applications_dir = "/usr/share/applications"
update_mime_database_bin = "update-mime-database"
update_desktop_database_bin = "update-desktop-database"
shared_mime_info_xmlns = "http://www.freedesktop.org/standards/shared-mime-info"
