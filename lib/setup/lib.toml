# meta.filename is the default name of the per-source_dir package-metadata
# manifest (see meta.rs) — overridable per request via CSetupBase.meta_filename.
[meta]
filename = "meta.toml"

# mount.default_mount_point is where the target deployment partition (and,
# under it, the ESP + any extra_mounts) gets mounted when the request's own
# mount_point is left empty.
[mount]
default_mount_point = "/mnt/upac-setup"

# btrfs.node_size/sector_size are mkfs.btrfs's own tunables (metadata b-tree
# node size / minimum I/O unit), matching mkfs.btrfs's own defaults —
# overridable per request via CSetupWholeDiskRequest.node_size/sector_size
# (0 ⇒ use these defaults).
[btrfs]
node_size = 16384
sector_size = 4096

# mkfs.ext4_bin/xfs_bin are the mkfs binaries shelled out to for ext4/xfs
# formatting (btrfs is done natively via btrfs-mkfs, ESP natively via fatfs —
# see [btrfs]).
[mkfs]
ext4_bin = "mkfs.ext4"
xfs_bin = "mkfs.xfs"

# genesis.scratch_filename is where the freshly-built package database is
# written (under the OS temp dir) before being embedded into the new /usr
# tree — purely transient, read back once right after the write.
[genesis]
scratch_filename = "genesis-packages.redb"
