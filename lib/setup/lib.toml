# mount.default_mount_point is where `bootstrap_system`'s MountStage mounts the target deployment
# partition (and, under it, the ESP) when the request's own mount_point is left empty.
[mount]
default_mount_point = "/mnt/upac-setup"

# mkfs.ext4_bin/xfs_bin are the mkfs binaries shelled out to for ext4/xfs
# formatting (btrfs is done natively via btrfs-mkfs, ESP natively via fatfs).
# mkfs.wipefs_bin clears a device's existing signatures (crate::wipe), only when the request
# explicitly opts into it (`force_wipe` on both `partition_table` and `format_partition`) — never
# run silently. Without force_wipe it still runs, in list-only mode (no `-a`), and the command
# refuses to touch a device that reports any signature at all (`DeviceNotEmpty`).
[mkfs]
ext4_bin = "mkfs.ext4"
xfs_bin = "mkfs.xfs"
wipefs_bin = "wipefs"

# partition.settle_attempts/settle_interval_ms bound how long `partition_add`'s SettleStage waits
# for the kernel (via udev) to create the new partition device node after BLKRRPART, before giving
# up — the ioctl itself is synchronous, but the /dev/vdaN node it triggers is created by udev
# asynchronously afterward.
#
# partition.fallback_sector_size is the logical sector size (bytes) `partition_table` builds the
# new GPT with when the BLKSSZGET ioctl can't report the device's real one (e.g. a plain disk
# image file instead of a block device). `partition_add` never uses it — it reads the sector size
# back from the existing GPT itself.
[partition]
fallback_sector_size = 512
settle_attempts = 50
settle_interval_ms = 100

# genesis.scratch_filename is where the freshly-built package database is
# written (under the OS temp dir) before being embedded into the new /usr
# tree — purely transient, read back once right after the write.
#
# efi_linux_dir is a real, mounted-filesystem-relative path (forward slashes, joined via
# `Path::join`) to where `composefs-boot`'s own UKI writer always lands `upac-to.efi`/
# `upac-from.efi` (`EFI/Linux/`, hardcoded upstream) — used only to seed `upac-from.efi` with the
# same first image on genesis's very first deploy. Distinct from `booters/booter.toml`'s
# `uki.efi_linux_dir`, which is the same directory spelled as a backslash UEFI device-path string
# for NVRAM Boot#### entries, not a filesystem path — the two can't share a definition across the
# crate boundary.
#
# system_dir is a source-relative directory, sibling to the package archives `EnumeratePackagesStage`
# scans (skipped by it automatically — it only looks at files, never directories) — a literal,
# 1:1 mirror of the target's real `/usr` layout (matches `PrefixTree`, see `database_path` in
# `lib/lib/lib.toml`), imported wholesale by `ImportSystemStage`. This is how a built `up`/
# `upac-lib`/booters (or anything else that must exist outside the normal per-package pipeline)
# gets onto a genesis'd disk — genesis never resolves or installs itself automatically, whoever
# assembles `--source` has to put it there, same assumption already made for the systemd-boot/
# rEFInd binaries.
#
# config_dir is system_dir's `/etc` counterpart: an optional source-relative directory mirroring the
# target's `/etc`, imported by `ImportSystemStage` into the config tree after every package's own
# `etc/`, so its files win on the same path. It is how config that no package ships reaches a
# freshly bootstrapped system (e.g. `/etc/upac.d/{decoders,boot-plugins}/*.toml`, which the new
# system's own `up` needs). Unlike the packages' `etc/`, it is imported even with `empty_config`.
#
# composefs_setup_root_unit_path (relative to `system_dir`, i.e. also relative to real `/usr`) is
# where `ImportSystemStage` requires to find a `composefs-setup-root.service` unit — hard error
# (`BootstrapError::ComposefsSetupRootUnitNotFound`) if missing, since a genesis'd disk cannot boot at
# all without it. `ImportSystemStage` deliberately does NOT create the unit's `*.target.wants/`
# enablement symlink itself — `initrd-root-fs.target` only exists inside the initrd's own systemd
# instance, so wanting it from the real root's unit tree is a no-op after switch-root. The dracut
# module under `hook/dracut/37composefs/` creates that enablement at initrd-build time instead
# (`$SYSTEMCTL --root "${initdir}" add-wants`), which is the only place it can actually take effect.
#
# initramfs_filename is fixed by composefs-boot itself, not our choice — `UsrLibModulesVmlinuz::
# load_all` only recognizes a vmlinuz's companion initramfs under this exact name. uki_filename is
# our own convention (composefs-boot only requires a `.efi` extension in `lib/modules/<kver>/` for
# `Type2Entry::load_all` to pick it up, the stem is free) — kept alongside initramfs_filename since
# `KernelStage` writes both under the same `lib/modules/<kver>/` directory.
[genesis]
scratch_filename = "genesis-packages.redb"

composefs_setup_root_unit_path = "lib/systemd/system/composefs-setup-root.service"
config_dir = "config"
efi_linux_dir = "EFI/Linux"
system_dir = "system"

initramfs_filename = "initramfs.img"
uki_filename = "uki.efi"
