# Names of the redb tables inside the package database embedded in the image.
# Changing a name means already-built images stop finding their tables when
# reading their DB (tables are looked up by name) — data isn't lost, but
# becomes unreachable through the API.
#
# database_path is where the redb file itself lives inside the mounted /usr
# tree (relative to that tree's root, e.g. read via FileHandle::read_file
# after Deploy::open_tree(prefix_digest), see doc §7). Changing it means
# already-built images stop finding their own embedded DB on read.
[database]
packages_table_name = "packages"
packages_by_name_table_name = "packages_by_name"
packages_triggers_table_name = "packages_triggers"
files_table_name = "files"
files_by_path_table_name = "files_by_path"
packages_meta_type_name = "upac::PackageMeta"
packages_triggers_type_name = "upac::DeclarativeTrigger"
files_entry_type_name = "upac::FileEntry"
database_path = "share/upac/packages.redb"
