# Names of the well-known directories on the deployment partition (deploy
# records + composefs repo, see doc §3). Changing a name means existing
# installs stop finding their deploys/repo on upgrade.
#
# prefix_digest_cmdline_param names the kernel cmdline parameter written at
# boot entry creation (§5.2, "composefs.digest=D'") and read back at runtime
# to resolve the currently booted deploy's prefix_digest — one name shared by
# both sides.
#
# next_seq_path is a single monotonic counter file, sysroot-relative (not
# per-deploy like deploys_dir), that hands out each new deploy record's `seq`
# (doc §5.7: "a built-in marker for finding the array element following it").
# config_dir_name is fixed relative to a single deploy record directory
# (`state/deploy/<usr-digest>/`, doc §3) — its `upper`/`work` children are the
# live overlayfs upper/work layers for that usr-digest's `/etc`, matching
# `composefs-setup-root`'s own hardcoded layout expectation (upstream, not
# something we get to pick freely).
#
# live_etc_dir is the real, absolute mount point of the running system's
# /etc (doc §3 (13): overlayfs merge of config_dir_name/upper over the
# current working_config) — used by `files add/remove --scope config` to
# read the live, already-merged content of a path regardless of which
# overlay layer it currently resolves from.
[deployment]
root_dir = "/"
deploys_dir = "state/deploy"
repo_dir = "composefs"
sysroot_dir = "sysroot"
record_filename = "meta.json"
prefix_digest_cmdline_param = "composefs.digest"
next_seq_path = "state/next-seq"
config_dir_name = "etc"
live_etc_dir = "/etc"

# esp_mount_primary/esp_mount_fallback are where the ESP is looked for, tried in that order
# against the running system's mount table (same rsmount::tables::MountInfo mechanism
# Deploy::device_path() already uses) — chapter 3 documents the ESP as mounted at either.
[boot]
esp_mount_primary = "/efi"
esp_mount_fallback = "/boot"
