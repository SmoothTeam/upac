# Names of the well-known directories on the deployment partition (deploy
# records + composefs repo, see doc §3). Changing a name means existing
# installs stop finding their deploys/repo on upgrade.
#
# next_prefix_filename is the JSON file inside deploys_dir naming the prefix
# deploy that boots next; `up` writes it together with the boot entry and
# builds every new prefix on top of it. running_prefix_path is the plain-text
# file (just the digest) upac's setup-root writes at boot naming the prefix it
# actually mounted; it lives in /run, so it only ever describes the current boot.
#
# prefix_meta_filename is the file inside a prefix deploy's directory that
# holds its mutable state: pinned, its own config deploys and the current one.
# config_dir_name is fixed relative to a single prefix deploy directory
# (`state/deploy/<usr-digest>/`, doc §3) — its `upper`/`work` children are the
# live overlayfs upper/work layers for that usr-digest's `/etc`, matching
# `composefs-setup-root`'s own hardcoded layout expectation (upstream, not
# something we get to pick freely).
#
# live_etc_dir is the real, absolute mount point of the running system's
# /etc (doc §3 (13): overlayfs merge of config_dir_name/upper over the
# current working_config) — used by `files add/remove --scope config` to
# read the live, already-merged content of a path regardless of which
# overlay layer it currently resolves from.
[deployment]
root_dir = "/"
deploys_dir = "state/deploy"
repo_dir = "composefs"
sysroot_dir = "sysroot"
prefix_meta_filename = "meta.json"
next_prefix_filename = "next.json"
running_prefix_path = "/run/upac/running"
config_dir_name = "etc"
live_etc_upper_dir_name = "upper"
live_etc_dir = "/etc"
