# Name of the abstract Unix socket address upac uses to hold its exclusive
# process lock (bind() on this address — a second concurrent upac gets
# EADDRINUSE). Changing the name doesn't break on-disk data compatibility,
# but a concurrently running old and new upac version stop seeing each other
# as competitors.
[runtime]
lock_address = "upac.lock"
