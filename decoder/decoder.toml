# Shared source of truth for external package-format constants used by decoder plugins. Each
# decoder's own build.rs reads this same file and generates its own private layout module;
# nothing here is a Cargo dependency between decoders, just a shared data file.

# Fixed archive-layout identifiers inside an .xbps (tar) archive, per xbps's own package
# format — never deployment-configurable, never change without a new package format entirely.
[xbps]
props_entry = "props.plist"
files_entry = "files.plist"
install_entry = "INSTALL"
remove_entry = "REMOVE"

# The action argument xbps passes to the INSTALL/REMOVE scripts, telling them whether they run
# before or after the files are unpacked/removed.
pre_action = "pre"
post_action = "post"

# props.plist's own <key> names, per xbps's property-list metadata format.
pkgname_key = "pkgname"
version_key = "version"
architecture_key = "architecture"
short_desc_key = "short_desc"
maintainer_key = "maintainer"
license_key = "license"
homepage_key = "homepage"
installed_size_key = "installed_size"
run_depends_key = "run_depends"
