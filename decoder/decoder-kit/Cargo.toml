[package]
name = "upac-lib-decoder-kit"
description = "upac's package decoder kit: one decoder, built in or loaded from its manifest, decoding a package into the store"
version.workspace = true

edition.workspace = true
rust-version.workspace = true

license.workspace = true

readme.workspace = true
homepage.workspace = true
repository.workspace = true

keywords.workspace = true
categories.workspace = true

include = ["/src"]

[lints]
workspace = true

[lib]
name = "upac_decoder_kit"

[dependencies]
upac-lib-abi       = { workspace = true }
upac-lib-composefs = { workspace = true, optional = true }
upac-lib-types     = { workspace = true, optional = true }

libloading = { workspace = true, optional = true }
serde      = { workspace = true, optional = true }
toml       = { workspace = true, optional = true }

mime     = { version = "0.3.17", optional = true }
zerocopy = { version = "0.8", optional = true }

[features]
host = [
    "dep:upac-lib-composefs",
    "dep:upac-lib-types",
    "dep:serde",
    "dep:toml",
    "dep:mime",
    "dep:zerocopy",
]
dynamic-plugins = ["host", "dep:libloading"]
