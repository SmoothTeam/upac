[package]
name = "upac-decoder-rpm"
description = "RPM (.rpm) package decoder plugin for upac, implementing rpm's package format"
version.workspace = true

edition.workspace = true
rust-version.workspace = true

license.workspace = true

readme.workspace = true
homepage.workspace = true
repository.workspace = true

keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[lib]
name = "upac_decoder_rpm"
crate-type = ["cdylib", "rlib"]

[dependencies]
upac-lib-abi         = { workspace = true }
upac-lib-composefs   = { workspace = true }
upac-lib-decoder-kit = { workspace = true, features = ["plugin"] }
upac-lib-types       = { workspace = true }

composefs = { workspace = true }
cpio      = { workspace = true }
flate2    = { workspace = true }
nix       = { workspace = true }
xz2    = { workspace = true }
zstd   = { workspace = true }

[build-dependencies]
toml = { workspace = true }

[features]
default = []
cdylib = []
