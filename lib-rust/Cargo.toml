[package]
name = "upac-lib"
version = "0.1.0"
edition = "2024"

[lib]
name = "upac"
crate-type = ["cdylib", "rlib"]

[dependencies]
upac-derive = { path = "../derive" }

nix = { version = "0.31.3", features = ["mount", "sched", "fs"] }
ostree = { version = "0.20", features = ["v2022_6"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

libmdbx = "0.6"
rmp-serde = "1"
rsblkid = "0.4"
rsmount = "0.2"
glib = "0.20"
gio = "0.20"


[build-dependencies]
toml = "0.8"
