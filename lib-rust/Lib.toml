# Имена таблиц libmdbx. Смена имени — уже созданные на дисках пользователей БД
# перестанут находиться (таблица ищется по имени в MDBX-формате), данные не потеряются,
# но станут недоступны через API.
[database]
packages_table_name = "packages"
files_table_name = "files"

# Имена служебных каталогов на deployment-разделе (деплои + ostree-репозиторий).
# Смена имени — существующие установки перестают находить свои деплои/репо при апгрейде.
[deployment]
root_dir = "/"
deploys_dir = "deploys"
repo_dir = "ostree-repo"
sysroot_dir = "sysroot"

# Имя abstract-адреса Unix-сокета, которым upac держит эксклюзивный лок процесса
# (bind() на этот адрес — второй параллельный upac получит EADDRINUSE). Смена имени
# не ломает совместимость с данными на диске, но одновременно запущенные старая
# и новая версия upac перестанут видеть друг друга как конкурентов.
[runtime]
lock_address = "upac.lock"
