# Upac configuration file
# Copy to /etc/upac/config.toml and adjust paths as needed
verbose = false

[paths]
# OSTree repo
repo_path = "/var/repo"
# Root of the filesystem where hardlinks are created
root_path = "/"
# Directory containing backend .toml descriptor files
backends_dir = "/usr/lib"

[ostree]
# Branch name used for OStree commits
branch  = "packages"
mode = "archive"
# Top-level entries created at init as symlinks pointing inside <root>/usr/.
# Example: "opt" -> /opt is a symlink to /usr/opt, swapped atomically with /usr.
symlinks = ["opt"]
